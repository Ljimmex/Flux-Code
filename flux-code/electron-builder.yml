appId: com.fluxcode.app
productName: Flux Code
copyright: Copyright © 2026
directories:
  output: release
  buildResources: assets
files:
  - dist-electron/**
  - dist/**
  - assets/**
extraResources:
  - from: dist-electron/preload.js
    to: dist-electron/preload.js
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - portable
linux:
  target:
    - AppImage
    - deb
  category: Development
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
